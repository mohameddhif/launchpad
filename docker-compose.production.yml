name: launchpad

networks:
  default:
    name: ${DOCKER_NETWORK:-deploy-net}
    external: true

volumes:
  postgres-data:
  nginx-conf:
  certbot-certs:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: [npx, tsx, src/index.ts]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set a long random JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set a base64 32-byte ENCRYPTION_KEY}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:?set the public HTTPS dashboard origin}
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:?set your DNS domain}
      TLS_ENABLED: ${TLS_ENABLED:-true}

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    command: [npx, tsx, src/index.ts]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      nginx: { condition: service_started }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set a base64 32-byte ENCRYPTION_KEY}
      DOCKER_NETWORK: ${DOCKER_NETWORK:-deploy-net}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:?set your DNS domain}
      TLS_ENABLED: ${TLS_ENABLED:-true}
      PREVIEW_CONTAINERS_PER_BRANCH: ${PREVIEW_CONTAINERS_PER_BRANCH:-3}
      STALE_PREVIEW_DAYS: ${STALE_PREVIEW_DAYS:-7}
      CLEANUP_INTERVAL_MS: ${CLEANUP_INTERVAL_MS:-3600000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - nginx-conf:/etc/nginx/conf.d
      - ./apps/nginx-templates:/repo/apps/nginx-templates:ro

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    depends_on: [dashboard]
    labels:
      launchpad.managed: "true"
      launchpad.role: nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - nginx-conf:/etc/nginx/conf.d
      - certbot-certs:/etc/nginx/certs:ro
    environment:
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:?set your DNS domain}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?set the public dashboard domain}
      TLS_ENABLED: ${TLS_ENABLED:-true}

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    restart: unless-stopped
    depends_on: [api]

  certbot:
    profiles: [tls]
    build:
      context: .
      dockerfile: infra/certbot/Dockerfile
    restart: unless-stopped
    environment:
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:?set your DNS domain}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:?set the renewal contact email}
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN:?set a Cloudflare DNS-edit token}
    volumes:
      - certbot-certs:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
